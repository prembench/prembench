[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "prembench"
dynamic = ["version"]
description = "Measured serving benchmarks for on-premise LLM deployments"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "mw.kang" }]
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "pydantic>=2.6",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "fastapi>=0.110",  # load.py 테스트용 mock 서버
    "uvicorn>=0.29",
]

[project.scripts]
prembench = "prembench.__main__:app"

[tool.hatch.version]
path = "prembench/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["prembench"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
